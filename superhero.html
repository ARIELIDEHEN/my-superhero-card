<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: darkblue;
            color: white;
            font-family: Arial, sans-serif;
        }
        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;
        }
        .tagline {
        text-transform: uppercase;
            font-style: italic;
            color: lightblue;
        }

        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: coral;
        }
        
    </style>
</head>
<body>
    <h1 class="hero-name">thunder kid</h1>
    <p class="tagline">the most powerful superhero in the world</p> 
    
    <h2 class="label">super powers</h2>
    <p class="power">can run faster than a cheetah</p>
    <p class="power">can lift a school bus</p>

    <h2 class="label">super weakness</h2>
    <p class="weakness">maths homework</p>
    <p class="weakness">broccoli</p>

    <p class="badge">top year</p>

    <p class="made-by">made by ARIEL</p>

</body>
</html>
